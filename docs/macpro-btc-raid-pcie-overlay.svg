<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Helvetica, Arial, sans-serif">
<rect width="1536" height="1024" fill="#05070A"/>
<text x="24" y="42" fill="#E8EDF4" font-size="28" font-weight="700" letter-spacing="2">PCIE SLOT ALLOCATION AND CABLE ROUTING</text>
<path d="M 1379.9,61.4 L 1379.9,102.4 L 768.0,122.9 L 156.1,102.4 L 156.1,61.4 L 768.0,41.0 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="75.4" y="71.0" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">PCIE RAID PATH</text>
<text x="75.4" y="99.0" fill="#A9B6C6" font-size="11">Four PCIe 1.0 slots on the Mac Pro 1,1 logic board; stock lane allocation 16/4/4/1, reconfigurable with the Expansion Slot Utility.</text>
<path d="M 495.5,215.0 L 495.5,276.5 L 322.6,307.2 L 149.6,276.5 L 149.6,215.0 L 322.6,184.3 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="136.9" y="214.3" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">SLOT 1 · X16</text>
<text x="136.9" y="242.3" fill="#A9B6C6" font-size="11">Slot 1 — double-wide 16-lane — graphics card stays here.</text>
<path d="M 495.5,368.6 L 495.5,430.1 L 322.6,460.8 L 149.6,430.1 L 149.6,368.6 L 322.6,337.9 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="136.9" y="367.9" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">SLOT 2 · X1</text>
<text x="136.9" y="395.9" fill="#A9B6C6" font-size="11">Slot 2 — one lane in the stock allocation — too narrow for a</text>
<text x="136.9" y="410.2" fill="#A9B6C6" font-size="11">RAID card.</text>
<path d="M 495.5,522.2 L 495.5,583.7 L 322.6,614.4 L 149.6,583.7 L 149.6,522.2 L 322.6,491.5 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="136.9" y="521.5" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">SLOT 3 · X4</text>
<text x="136.9" y="549.5" fill="#A9B6C6" font-size="11">Slot 3 — four lanes — usable alternative for the RAID card.</text>
<path d="M 495.5,681.0 L 495.5,752.6 L 322.6,788.5 L 149.6,752.6 L 149.6,681.0 L 322.6,645.1 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="136.9" y="675.1" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">SLOT 4 · X4</text>
<text x="136.9" y="703.1" fill="#A9B6C6" font-size="11">Slot 4 — four lanes at 2.5 GT/s (PCIe 1.0) — RAID card lives</text>
<text x="136.9" y="717.4" fill="#A9B6C6" font-size="11">here; about 1 GB/s uplink, far above what three HDDs can</text>
<text x="136.9" y="731.7" fill="#A9B6C6" font-size="11">push.</text>
<path d="M 901.0,353.3 L 901.0,445.4 L 768.0,491.5 L 635.0,445.4 L 635.0,353.3 L 768.0,307.2 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="628.4" y="337.2" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">RAID CARD</text>
<text x="628.4" y="365.2" fill="#A9B6C6" font-size="11">4-port SATA/SAS controller with one SFF-8087</text>
<text x="628.4" y="379.5" fill="#A9B6C6" font-size="11">connector, RAID 0/1/3/5/6/10, 256 MB cache,</text>
<text x="628.4" y="393.8" fill="#A9B6C6" font-size="11">Intel IOP-class RAID processor.</text>
<path d="M 1155.0,368.6 L 1155.0,450.6 L 1075.2,491.5 L 995.4,450.6 L 995.4,368.6 L 1075.2,327.7 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="997.0" y="357.7" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">SFF-8087</text>
<text x="997.0" y="385.7" fill="#A9B6C6" font-size="11">One SFF-8087 to four SATA</text>
<text x="997.0" y="400.0" fill="#A9B6C6" font-size="11">breakout — three leads</text>
<text x="997.0" y="414.3" fill="#A9B6C6" font-size="11">run to bays 2, 3 and 4,</text>
<text x="997.0" y="428.6" fill="#A9B6C6" font-size="11">one spare lead is left</text>
<text x="997.0" y="442.9" fill="#A9B6C6" font-size="11">capped.</text>
<path d="M 1458.1,312.3 L 1458.1,486.4 L 1351.7,573.4 L 1245.3,486.4 L 1245.3,312.3 L 1351.7,225.3 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="1242.8" y="255.3" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">3 X 1 TB</text>
<text x="1242.8" y="283.3" fill="#A9B6C6" font-size="11">Bays 2, 3 and 4 — three 1 TB 3.5in</text>
<text x="1242.8" y="297.6" fill="#A9B6C6" font-size="11">HDDs on their sleds. The</text>
<text x="1242.8" y="311.9" fill="#A9B6C6" font-size="11">logic-board bay SATA ports are left</text>
<text x="1242.8" y="326.2" fill="#A9B6C6" font-size="11">unpopulated while the breakout is</text>
<text x="1242.8" y="340.5" fill="#A9B6C6" font-size="11">in use.</text>
<path d="M 1379.9,954.9 L 1379.9,980.5 L 768.0,993.3 L 156.1,980.5 L 156.1,954.9 L 768.0,942.1 Z" fill="#0A0E14" fill-opacity="0.72" stroke="#E8EDF4" stroke-opacity="0.55" stroke-width="2"/>
<text x="75.4" y="972.1" fill="#E8EDF4" font-size="20" font-weight="700" letter-spacing="1.5">EFI32 · NO BOOT</text>
<text x="75.4" y="1000.1" fill="#A9B6C6" font-size="11">MacPro1,1 has 32-bit EFI, so an Option ROM that is 64-bit only will not boot from the card. That is fine here: the array is a data vault, the system boots from the Bay 1 SSD.</text>
</svg>
