<!DOCTYPE html>

<head>

<title>Burn</title>
<style type="text/css">
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:"Lucida Grande","Lucida Sans Unicode",Helvetica,Arial,sans-serif;
  font-size:13px;color:#000;background:#ececec;
  -moz-osx-font-smoothing:grayscale;
}
#win{
  width:460px;margin:48px auto 0;background:#ececec;

}
#bar{
  height:22px;position:relative;
  background:#c8c8c8;
  background:-moz-linear-gradient(top,#e8e8e8 0%,#c4c4c4 100%);
  background:linear-gradient(to bottom,#e8e8e8 0%,#c4c4c4 100%);
  border-bottom:1px solid #9a9a9a;
  -moz-border-radius:6px 6px 0 0;border-radius:6px 6px 0 0;
}
#dots{position:absolute;left:8px;top:5px;white-space:nowrap;}
#dots b{
  display:inline-block;width:12px;height:12px;margin-right:6px;
  -moz-border-radius:6px;border-radius:6px;
  border:1px solid #8a8a8a;
  background:#d9d9d9;
  background:-moz-linear-gradient(top,#f2f2f2,#cfcfcf);
  background:linear-gradient(to bottom,#f2f2f2,#cfcfcf);
  vertical-align:top;
}
#bar h1{
  margin:0;padding:0;text-align:center;font-size:13px;font-weight:bold;
  line-height:22px;color:#404040;text-shadow:0 1px 0 #f6f6f6;
}
#body{padding:18px 22px 16px;}
p{margin:0 0 12px;line-height:1.35;}
.row{margin:14px 0;}
.k{color:#222;margin-right:8px;}
a.link{
  color:#053f96;text-decoration:underline;
  font-family:"Lucida Grande",sans-serif;font-size:13px;
}
input[type=file]{
  font-family:"Lucida Grande",sans-serif;font-size:13px;
  max-width:100%;
}
#btns{text-align:right;margin-top:22px;}
a.aqua,button.aqua,input.aqua{
  display:inline-block;vertical-align:middle;
  -moz-appearance:none;appearance:none;
  font-family:"Lucida Grande","Lucida Sans Unicode",sans-serif;
  font-size:13px;line-height:19px;height:21px;
  padding:0 18px;margin-left:10px;
  border:1px solid #5a5a5a;
  -moz-border-radius:11px;border-radius:11px;
  background:#e6e6e6;
  background:-moz-linear-gradient(top,#fff 0%,#f3f3f3 48%,#e4e4e4 49%,#cfcfcf 100%);
  background:linear-gradient(to bottom,#fff 0%,#f3f3f3 48%,#e4e4e4 49%,#cfcfcf 100%);
  -moz-box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,0.12);
  box-shadow:inset 0 1px 0 #fff,0 1px 1px rgba(0,0,0,0.12);
  color:#000;text-shadow:0 1px 0 #fff;
  text-decoration:none;cursor:default;
}
a.aqua.default,button.aqua.default{
  border-color:#2a5a86;color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,0.35);
  background:#3d89d3;
  background:-moz-linear-gradient(top,#7ebef3 0%,#4d9ee6 48%,#2176c4 49%,#4aa3ea 100%);
  background:linear-gradient(to bottom,#7ebef3 0%,#4d9ee6 48%,#2176c4 49%,#4aa3ea 100%);
  -moz-box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),0 0 0 3px rgba(80,160,230,0.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.45),0 0 0 3px rgba(80,160,230,0.35);
}
a.aqua:active,button.aqua:active{
  background:#c0c0c0;
  background:-moz-linear-gradient(top,#b0b0b0,#d8d8d8);
  background:linear-gradient(to bottom,#b0b0b0,#d8d8d8);
}
a.aqua.default:active{
  background:#216ebd;
  background:-moz-linear-gradient(top,#2a6cb0,#4a9de0);
  background:linear-gradient(to bottom,#2a6cb0,#4a9de0);
}
#st{color:#276c2e;min-height:1.2em;margin-top:8px;}
iframe{width:0;height:0;border:0;position:absolute;left:-9999px;}
</style>
</head>
<body>
<div id="win">

</html>
